env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

name: WWR notifier

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  notify:
    runs-on: ubuntu-latest

    environment: .env

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Restore seen_jobs.json
        run: |
          if [ ! -f seen_jobs.json ]; then
            echo "[]" > seen_jobs.json
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Debug environment access
        run: |
          echo "job environment is attached"
          [ -n "${{ secrets.TELEGRAM_BOT_TOKEN }}" ] && echo "BOT token exists" || echo "BOT token missing"
          [ -n "${{ secrets.TELEGRAM_CHAT_ID }}" ] && echo "CHAT ID exists" || echo "CHAT ID missing"

      - name: Run notifier
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python wwr_notifier.py

      - name: Commit updated seen_jobs.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen_jobs.json
          # Only commit if there are actually changes
          git diff --cached --quiet || git commit -m "Update seen jobs"
          git push
